margin: -1px;
padding: 0;
border: 0;
opacity: 0;
overflow: hidden;

}
@keyframes fadeIn {
from { opacity: .1; }
to { opacity: 1; }
}
@keyframes fadeUp {
from { opacity: .1; transform: translate3d(0,.5rem,0); }
to { opacity: 1; transform: translate3d(0,0,0); }
}
@keyframes swap {
0%, 40% { opacity: 0; }
60%, 100% { opacity: 1; }
}
@keyframes starfall {
0% { opacity: .5; border-radius: 50%;
transform: rotate(150deg) translateY(0); }
100% { opacity: .1; border-radius: 50%;
transform: rotate(150deg) translateY(-100rem); }
}

.board {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: .5rem;
width: 100%;
max-width: 25rem;
margin: .75rem auto;
aspect-ratio: 1 / 1;
}
.card {
position: relative;
width: 100%;
height: 100%;
background: transparent;
transform-style: preserve-3d;
}
.card-face {
position: absolute;
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
border-radius: .5rem;
font-size: 3rem;
backface-visibility: hidden;
}
.card-front {
background: #eef;
box-shadow: 0 .1rem .1rem #888;
transform: rotateY(180deg);
}
.card-back {
background: #200;
}
.card-back::after {
content: "🔘";
color: #eef;
font-size: 1.5rem;
}
.card.flip {
transform: rotateY(180deg);
}
