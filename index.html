font-size: 1.25rem;
text-align: center;
color: #111;
background: #eef;
}
.box {
margin: 0 auto 1rem;
padding: .7rem 1.5rem 1.2rem;
}
.box .swap {
display: grid;
place-items: center;
}
.swap b, .swap span {
grid-area: 1 / 1;
animation: swap 5s infinite alternate;
}
.swap b:last-child,
.swap span:last-child {
animation-direction: alternate-reverse;
}
.menu {
margin: 0 auto 1rem;
font-size: 1.5rem;
font-weight: 700;
}
.menu a {
display: flex;
width: 100%;
padding: .5rem 0 1rem;
}
.menu .left, .menu .right {
width: 1.75rem;
padding: .25rem .75rem 0;
fill: #111;
}
.menu .left {
margin-right: auto;
}
.menu .right {
margin-left: auto;
}
.button, .search {
width: 100%;
padding: .7rem 0 1.2rem;
}
.button {
margin: .75rem auto .25rem;
color: #eef;
background: #111;
}
.search {
margin: 0 auto 1rem;
}
.source, .source a {
margin: -1.25rem .5rem .25rem;
}
.copyright p, .copyright a {
max-height: 100%;
margin: 0 auto 1.25rem;
color: #eef;
font-size: .75rem;
}
.sr-only {
position: absolute;
width: 1px;
height: 1px;
margin: -1px;
padding: 0;
border: 0;
opacity: 0;
overflow: hidden;
white-space: nowrap;
}
.motion span {
position: fixed;
top: 0%;
z-index: -1;
display: block;
width: 0.15rem;
background-color: #888;
animation: starfall 10s linear infinite;
will-change: transform, opacity;
}
.motion span:nth-child(1)
{ left: 0%; height: 10rem; animation-duration: 20s; }
.motion span:nth-child(2)
{ left: 15%; height: 6rem; animation-duration: 12s; }
.motion span:nth-child(3)
{ left: 30%; height: 8rem; animation-duration: 16s; }
.motion span:nth-child(4)
{ left: 45%; height: 4rem; animation-duration: 8s; }
.motion span:nth-child(5)
{ right: 0%; height: 4rem; animation-duration: 6s; }
.motion span:nth-child(6)
{ right: 15%; height: 10rem; animation-duration: 18s; }
.motion span:nth-child(7)
{ right: 30%; height: 6rem; animation-duration: 10s; }
.motion span:nth-child(8)
{ right: 45%; height: 8rem; animation-duration: 14s; }
@keyframes fadeIn {
from { opacity: .1; }
to { opacity: 1; }
}
@keyframes fadeUp {
from { opacity: .1; transform: translate3d(0,.5rem,0); }
to { opacity: 1; transform: translate3d(0,0,0); }
}
@keyframes swap {
0%, 40% { opacity: 0; }
60%, 100% { opacity: 1; }
}
@keyframes starfall {
0% { opacity: .5; border-radius: 50%;
transform: rotate(150deg) translateY(0); }
100% { opacity: .1; border-radius: 50%;
transform: rotate(150deg) translateY(-100rem); }
}
@font-face {
font-display: swap;
font-family: "font";
src: url("/static/font.woff2");
}
/* linear */
body {
background: linear-gradient(180deg, #300 0%, #012 100%);
background-color: #200;
}
.icon {
fill: #eef;
}
.box, .menu, .button, .search {
border: .1rem solid transparent;
color: #200;
background: #eef;
}
.menu .left, .menu .right {
fill: #200;
}
.button {
color: #eef;
background: #200;
}
.copyright p, .copyright a {
color: #eef;
}
/* game */
.board {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: .5rem;
width: 100%;
max-width: 25rem;
margin: .75rem auto;
aspect-ratio: 1 / 1;
}
.card {
position: relative;
width: 100%;
height: 100%;
background: transparent;
transform-style: preserve-3d;
}
.card-face {
position: absolute;
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
border-radius: .5rem;
font-size: 3rem;
backface-visibility: hidden;
}
.card-front {
background: #eef;
box-shadow: 0 .1rem .1rem #888;
transform: rotateY(180deg);
}
.card-back {
background: #200;
}
.card-back::after {
content: "🔘";
color: #eef;
font-size: 1.5rem;
}
.card.flip {
transform: rotateY(180deg);
}
</style>

<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("/static/service.js");
navigator.serviceWorker.ready.then(async function (registration) {
if ("sync" in registration) {
registration.sync.register("sync").catch(function (err) {
console.warn("Background sync is disabled."); });
} try {
if ("periodicSync" in registration) {
const periodicSyncPermission = await navigator.permissions.query({
name: "periodic-background-sync", });
if (periodicSyncPermission.state === "granted") {
await registration.periodicSync.register("fetch-new-content", {
minInterval: 24 * 60 * 60 * 1000,
});}}
} catch (error) {
console.warn("Periodic sync is disabled.");
}});}

document.addEventListener("DOMContentLoaded", function () {
const shareBtn = document.getElementById("share");
if (shareBtn) { 
shareBtn.addEventListener("click", function () {
if (navigator.share) {
navigator.share({
title: "Bayu Angora",
url: window.location.href, })
.then(() => console.log("Thanks"))
.catch(console.error);
}});}
  
const darkBtn = document.getElementById("dark");
const lightBtn = document.getElementById("light");
function setMode(isDark) {
if (isDark) {
if (lightBtn) lightBtn.style.display = "block";
if (darkBtn) darkBtn.style.display = "none";
localStorage.setItem("preferredTheme", "dark");
} else {
if (lightBtn) lightBtn.style.display = "none";
if (darkBtn) darkBtn.style.display = "block";
localStorage.removeItem("preferredTheme");}
document.body.classList.toggle("mode", isDark);}
if (localStorage.getItem("preferredTheme") === "dark") {
setMode(true);}
if (darkBtn) {
darkBtn.addEventListener("click", function () {
setMode(true); });}
if (lightBtn) {
lightBtn.addEventListener("click", function () {
setMode(false);
});}});

const board = document.getElementById("board");
if (board) {
const emojis =
["🏜", "🏞", "🌃", "🌄", "🌇", "🌉", "🌌", "🎑"];
let firstCard, lockBoard, moves, matches; 
const movesEl = document.getElementById("moves");
const matchesEl = document.getElementById("matches");
document.getElementById("restart").addEventListener("click", initGame);
board.addEventListener("click", (e) => {
const card = e.target.closest(".card");
if (!card || lockBoard || card === firstCard || card.classList.contains("flip"))
return; card.classList.add("flip");
if (!firstCard) {firstCard = card;
return;} moves++;
if (firstCard.dataset.e === card.dataset.e) {matches++; firstCard = null;
if (matches === 8) setTimeout(() =>
alert(`✨ Score 8 / ${moves} Moves ✨`), 1000);
} else {
lockBoard = true; setTimeout(() => {
firstCard.classList.remove("flip");
card.classList.remove("flip");
firstCard = null; lockBoard = false;}, 1000);} updateStats();});
function initGame() {
firstCard = null; lockBoard = false;
moves = matches = 0; updateStats(); board.innerHTML = "";
const cards = [...emojis, ...emojis];
for (let i = 15; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[cards[i], cards[j]] = [cards[j], cards[i]];}
const frag = document.createDocumentFragment(); cards.forEach(emoji => {
const d = document.createElement("div");
d.className = "card"; d.dataset.e = emoji; d.innerHTML = `
<div class="card-face card-front">${emoji}</div>
<div class="card-face card-back"></div>`;
frag.appendChild(d);}); board.appendChild(frag);}
function updateStats() {
movesEl.textContent = moves; matchesEl.textContent = matches;}
initGame();}
</script>
